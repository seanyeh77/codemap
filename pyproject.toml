[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codemap"
version = "0.2.0"
description = "Static code maps for people and AI: compiler call graph, rule scan, validated tours"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
diagram = ["pillow"]
viewer = ["fastapi>=0.162", "uvicorn>=0.54"]

[project.scripts]
codemap = "codemap.cli:main"

[tool.setuptools]
packages = ["codemap"]

[tool.setuptools.package-data]
codemap = ["viewer_dist/index.html", "viewer_dist/assets/*"]
